  <style>
   /* 页面重置与布局：让整个页面变成垂直的弹性盒子 */
   html, body {
	   margin: 0;
	   padding: 0;
	   height: 100%; /* 让 body 占满整个屏幕高度 */
	   display: flex;
	   flex-direction: column; /* 垂直排列头部、主体、底部 */
	   text-align: center;
   }
   
   /* 头部和底部固定高度，不参与拉伸 */
   header, nav, hr {
	   flex-shrink: 0; /* 防止被挤压 */
   }
   
   hr {
	   /* 1. 把左右自动边距干掉，让它能撑满 */
	   margin-left: 0;
	   margin-right: 0;
   }
   
   /* 重点：让 main 占据所有剩余的屏幕空间 */
   main {
	   flex: 1; /* main 自动吃掉中间所有的剩余屏幕空间 */
	   display: flex;
	   flex-direction: column;
	   overflow: hidden; /* 防止外层出现滚动条 */
   }
   
   
   
   /* CSS样式 */
   /* 加了点，就变成了“类选择器” */
   .页面框架{
	   display: none;
	   width: 100%;
	   /* iframe 填满 main 的区域 */
	   height: 100%; /* 这里的 100% 是相对于父元素 main 的，因为 main 被撑开了，所以这里生效了 */
	   border: 0;
   }
   
   .页面框架.激活{
	   display: block;
   }
   
   
   
   nav {
	   display: flex;
	   gap: 10px;
	   padding: 10px 12px;
	   background: #fff;
   }
   
   nav button {
	   flex: 1;display: flex;              /* 新增 */
	   flex-direction: column;     /* 新增：图标在上文字在下 */
	   align-items: center;        /* 新增 */
	   justify-content: center;    /* 新增 */
	   gap: 3px;                   /* 新增 */
	   border: none;
	   border-radius: 255px;
	   padding: 12px 0;
	   font-size: 16px;
	   min-height: 44px;
	   background: #f2f3f5;
	   color: #303133;
	   cursor: pointer;
	   transition: background .15s;
   }
   
   nav button.激活{
	   color: blue; 
	   font-weight: bold; 
   }
   
   nav button svg {              /* 关键：限制图标大小 */
	   width: 22px;
	   height: 22px;
	   display: block;
   }
  </style>
  
  
  
  
  <script charset="utf-8" type="application/javascript">
   'use strict';
   
   function 切换页面(页面名称, 当前按钮) {
	   // 隐藏所有 页面框架
	   document.querySelectorAll('.页面框架').forEach(function (框架) {
		   框架.classList.remove('激活');
	   });
	   
	   // 显示目标 页面框架
	   const 目标 = document.getElementById(页面名称 + '框架');
	   if (目标) {
		   目标.classList.add('激活');
		}
		
		// 按钮高亮
		document.querySelectorAll('nav button').forEach(function (按钮) {
			按钮.classList.remove('激活');
		});
		if (当前按钮) {
			当前按钮.classList.add('激活');
		}
	}
  </script>
 </body>
