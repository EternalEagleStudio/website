<!DOCTYPE html>
<html lang="zh-CN">
 <head>
  <meta charset="utf-8">
  <base href="/website/EternalEagleStudio/src/">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="cache-control" content="no-cache">
  <title>衡鹰工作室</title>
  <style>
	/* 页面基础样式 */
	body { 
	  font-family: sans-serif; 
	  background: #f4f6f8; 
	  margin: 0; 
	  padding: 15px; 
	  text-align: center; 
	}
	
	/* 工具卡片网格布局 */
	.tool-grid { 
	  display: grid; 
	  grid-template-columns: 1fr 1fr; /* 双列布局 */
	  gap: 15px; 
	  max-width: 600px; 
	  margin: 0 auto; 
	}
	
	/* 单个卡片样式 */
	.tool-card {
	  background: #fff; 
	  border-radius: 12px; 
	  padding: 20px 10px; 
	  text-decoration: none;
	  color: #333; 
	  box-shadow: 0 2px 8px rgba(0,0,0,0.05); 
	  transition: transform 0.2s;
	  display: flex; 
	  flex-direction: column; 
	  align-items: center; 
	  justify-content: center;
	}
	
	/* 点击时的反馈动画 */
	.tool-card:active { 
	  transform: scale(0.96); 
	  background: #f0f8ff; 
	}
	
	/* 图标、名称、描述样式 */
	.tool-card .icon { font-size: 36px; margin-bottom: 10px; }
	.tool-card .name { font-weight: bold; font-size: 16px; }
	.tool-card .desc { font-size: 12px; color: #888; margin-top: 5px; }
  </style>
 </head>
 <body>
  
  <header>工具子碎片</header>
  
  <p style="color: #666; font-size: 14px; margin-bottom: 20px;">点击卡片打开对应的工具</p>

  <div class="tool-grid">
	<!-- 
	  跳转到 Mermaid 编辑器 
	  【重点修改】：去掉了 target="_blank"。
	  这样点击后，页面会在当前的 iframe（工具框架）内直接跳转，
	  配合 Mermaid.html 内部的“返回工具箱”按钮，体验最佳。
	-->
	<a href="Four_Components/Activity/InAPP_Activity_Page/HomeAPP/Tool/Mermaid/Mermaid.html" class="tool-card">
	  <div class="icon">🧜‍♀️</div>
	  <div class="name">Mermaid 图表</div>
	  <div class="desc">流程图/时序图生成</div>
	</a>

	<!-- 跳转到 Markdown 编辑器（同样去掉了 target="_blank"） -->
	<a href="Four_Components/Activity/InAPP_Activity_Page/HomeAPP/Tool/Markdown/Markdown.html" class="tool-card">
	  <div class="icon">📝</div>
	  <div class="name">Markdown</div>
	  <div class="desc">文本排版与渲染</div>
	</a>
	
	<!-- 以后可以在这里继续添加新工具，只需要复制上面的 <a> 标签并修改内容即可 -->
  </div>
 </body>
</html>
