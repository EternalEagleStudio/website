<!DOCTYPE html>
<html lang="zh-CN">
 <head>
  <meta charset="utf-8">
  <base href="/website/EternalEagleStudio/src/">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="cache-control" content="no-cache">
  <title>Handsontable 导出 HTML 示例</title>
  
  <noscript>
   您的浏览器不能执行 JavaScript 语言，页面无法正常显示。
  </noscript>
  
  <!-- 【修复】Handsontable 18 新版样式表 -->
  <link rel="stylesheet" href="Tool/npm/handsontable@18.1.2/styles/handsontable.min.css">
  <link rel="stylesheet" href="Tool/npm/handsontable@18.1.2/styles/ht-theme-main.min.css">
  
  <script src="Tool/npm/handsontable@18.1.2/dist/handsontable.full.min.js"></script>
  
  <style>
	body { font-family: sans-serif; margin: 20px; }
	#hot { margin-bottom: 20px; }
	button { padding: 8px 16px; font-size: 14px; cursor: pointer; }
  </style>
 </head>
 
 <body style="text-align: center;">
  
  <script type="text/javascript">
	if (!('blocking' in document.createElement('link'))) {
	  const banner = document.createElement('div');
	  banner.textContent = '检测到您的浏览器版本较旧，部分功能可能受限。建议使用 谷歌Chrome ， 微软Edge ， 百度Baidu ， QQ浏览器 ， 360浏览器 等浏览器 或更新系统。';
	  banner.style.cssText = 'background:#ffc107;color:#333;text-align:center;padding:8px;';
	  document.body.prepend(banner);
	}
  </script>
  
  <header>数学</header>

  <h3>可视化编辑区</h3>
  <div id="hot"></div>
  
  <button id="exportBtn">导出为 HTML 文件</button>

  <script>
	const container = document.getElementById('hot');
	const hot = new Handsontable(container, {
	  data: [
		[1, '小学数学', '加法', '加数 + 加数 = 和'],
		[2, '初中数学', '代数', '用字母表示数'],
	  ],
	  colHeaders: ['索引', '分类', '标签', '内容'],
	  rowHeaders: true,
	  contextMenu: true,
	  licenseKey: 'non-commercial-and-evaluation'
	});

	document.getElementById('exportBtn').addEventListener('click', () => {
	  const htmlTableString = hot.toHTML();
	  
	  const fullHTML = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>导出的表格</title></head><body>${htmlTableString}</body></html>`;
	  
	  const blob = new Blob([fullHTML], { type: 'text/html;charset=utf-8' });
	  const url = URL.createObjectURL(blob);
	  const a = document.createElement('a');
	  a.href = url;
	  a.download = 'table-export.html';
	  a.click();
	  URL.revokeObjectURL(url);
	});
  </script>
  
  <hr>
 </body>
</html>
