<!DOCTYPE html>
<html lang="zh-CN">
 <head>
  <meta charset="utf-8">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="cache-control" content="no-cache">
  <title>衡鹰工作室</title>
  
  <!-- 浏览器不支持或关闭 JavaScript -->
  <noscript>
   您的浏览器不能执行 JavaScript 语言，页面无法正常显示。
  </noscript>
 </head>
 
 
 
 <body style="text-align: center;">
  
  
  
  <script type="text/javascript">
	 if (!('blocking' in document.createElement('link'))) {
	 // 轻提示：建议升级浏览器以获得最佳体验
	 const banner = document.createElement('div');
	 banner.textContent = '检测到您的浏览器版本较旧，部分功能可能受限。建议使用 谷歌Chrome ， 微软Edge ， 百度Baidu ， QQ浏览器 ， 360浏览器 等浏览器 或更新系统。';
	 banner.style.cssText = 'background:#ffc107;color:#333;text-align:center;padding:8px;';
	 document.body.prepend(banner);
	}
  </script>
  
  
  
  <header>数学</header>
  <main>
   <section>
	<table>
	 <colgroup>          <!-- 控制列宽/列样式，不产生内容 -->
	  <col span="1" style="width: 80px;">
	  <col span="3">
	 </colgroup>
	 
	 <caption>数学知识</caption>
	 
	 <!-- 表头行 -->
	 <thead>
	  <tr>
	   <th>索引</th>
	   <th>分类</th>
	   <th>标签</th>
	   <th>内容</th>
	  </tr>
	  
	  <tr>
	   <td>小学数学</td>
	   <td>初中数学</td>
	   <td>高中数学</td>
	   <td>大学数学</td>
	  </tr>
	 </tbody>
	 
	 <!-- 数据行，可多个 -->
	 <tbody>
	  <tr>
	   <td>加法</td>
	  </tr>
	 </tbody>
	 
	 <!-- 汇总行 -->
	 <tfoot>
	  <tr>
	   <td colspan="4">备注</td>
	  </tr>
	 </tfoot>
	 
	</table>
   </section>
  </main>
  
  
  
  <hr>
 </body>
</html>
