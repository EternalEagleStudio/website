  <div class="表单" title="表单">
	<!-- 删掉了 onsubmit 属性，在页面底部用 JS 绑定 -->

  <script charset="utf-8" type="application/javascript">
   'use strict';
	 
	 /* ==================== 全局常量 ==================== */
	 const 客户端版本号 = '0.1.0';
	 const 未知 = '未知( UnKnow )';
	 
	 /* ==================== 🌟 严格按照数据库说明采集客户端信息 ==================== */
	 // 1) 服务端平台：用于确定用户使用的网页服务托管平台（根据域名推断）
	 function 取服务端平台() {
		 try {
			 const 当前域名 = location.hostname || '';
			 
			 if (当前域名 === 'localhost' || 当前域名 === '127.0.0.1' || 当前域名.startsWith('192.168.')) {
				 return '本地开发环境';
			 }
			 
			 if (当前域名.endsWith('free.nf'))        return 'InfinityFree';
			 if (当前域名.endsWith('github.io'))      return 'GitHub Pages';
			 if (当前域名.endsWith('vercel.app'))     return 'Vercel';
			 if (当前域名.endsWith('netlify.app'))    return 'Netlify';
			 if (当前域名.endsWith('gitee.io'))       return 'Gitee Pages';
			 if (当前域名.endsWith('cloudflare.com')) return 'Cloudflare Pages';
			 
			 return 当前域名 || 未知;
		 } catch (e) {
			 return 未知;
		 }
	 }
	 
	 // 2) 域名：用于确定用户使用的域名
	 function 取域名() {
		 try {
			 return location.origin || location.hostname || 未知;
		 } catch (e) {
			 return 未知;
		 }
	 }
	 
	 // 3) 组装成与数据库默认值结构一致的对象
	 function 获取客户端信息() {
		 return {
			 "平台": 取服务端平台(),
			 "域名": 取域名(),
			 "客户端版本号": 客户端版本号
		 };
	 }
	 
	 /* ==================== 核心注册逻辑 ==================== */
	 async function 保存数据(event) {
		 event.preventDefault();
		 
		 const 表单 = document.getElementById('表单');
		 const 用户名 = document.getElementById('用户名').value.trim();
		 const 密码 = document.getElementById('密码').value;
		 
		 if (!表单.checkValidity()) { 表单.reportValidity(); return; }
		 
		 // 1. 获取 Turnstile 令牌
		 const 令牌元素 = document.querySelector('[name="cf-turnstile-response"]');
		 const 验证令牌 = 令牌元素 ? 令牌元素.value : '';
		 
		 if (!验证令牌) {
			 alert('请先完成人机验证！');
			 return;
		 }

		 try {
			 // 2. 把所有数据一次性打包发给云函数，让云端去操心加密和入库！
			 const { data: 结果, error: 错误 } = await 数据库.functions.invoke('verify-turnstile', {
				 body: { 
					 token: 验证令牌,
					 用户名: 用户名,
					 密码: 密码, // 前端不再加密，直接传明文（HTTPS 会保证传输安全）
					 客户端信息: 获取客户端信息()
				 }
			 });

			 if (错误) throw 错误;
			 if (!结果 || !结果.success) throw new Error(结果.message || '云端处理失败');

			 alert('注册成功！即将返回登录界面。');
			 表单.reset();
			 window.location.href = "Four_Components/Activity/LoginAPP/LoginActivity.html";

		 } catch (错误) {
			 console.error('完整错误对象：', 错误);
			 
			 let 详细错误 = 错误.message;
			 if (错误.context && typeof 错误.context.text === 'function') {
				 详细错误 = await 错误.context.text();
			 }
			 
			 if (window.turnstile) turnstile.reset();
			 alert('注册失败详情：\n' + 详细错误);
		 }
	 }
	 
	 // 🌟 核心修复：在页面底部绑定事件，解决 "保存数据 is not defined" 的问题
	 document.getElementById('表单').addEventListener('submit', 保存数据);
  </script>
