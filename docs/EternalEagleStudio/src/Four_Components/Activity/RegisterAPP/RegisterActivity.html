			return;
		}

	 function 生成验证码() {
	  let 验证码 = document.getElementById('辅助验证信息').value;
	  let 现在的时间 = new Date().getTime();
	  验证码 = Math.round(Math.abs(现在的时间 * Math.SQRT2 * Math.PI * Math.random()));
	  document.getElementById("辅助验证信息").setAttribute("value", 验证码);alert('无需复制\n验证码是：' + 验证码 + '\n测试验证码');
	 }
