   <script>
	 'use strict';
	 
	 function 获取数据() {
		 // 函数体
	 }
	 
	 function 验证码函数() {
	  let 验证码 = document.getElementById('辅助验证信息').value;
	  setInterval(function() {
	   let 现在的时间 = new Date().getUTCMilliseconds();
	   验证码 = Math.round(Math.abs(现在的时间 * Math.SQRT2 * Math.PI * Math.random()));
	   document.getElementById("辅助验证信息").setAttribute("value", 验证码);
	  }, 1);}
	 
	 验证码函数();
