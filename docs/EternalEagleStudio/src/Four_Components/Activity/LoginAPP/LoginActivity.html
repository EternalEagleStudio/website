  <script charset="utf-8" type="application/javascript">
	 'use strict';
	 
	 async function 执行登录(event) {
		 event.preventDefault();
		 
		 const 表单 = document.getElementById('表单');
		 const 用户名 = document.getElementById('用户名').value.trim();
		 const 密码 = document.getElementById('密码').value;
		 
		 if (!表单.checkValidity()) { 表单.reportValidity(); return; }
		 
		 // 获取 Turnstile 令牌
		 const 令牌元素 = document.querySelector('[name="cf-turnstile-response"]');
		 const 验证令牌 = 令牌元素 ? 令牌元素.value : '';
		 
		 if (!验证令牌) {
			 alert('请先完成人机验证！');
			 return;
		 }

		 try {
			 // 🌟 调用云端登录接口
			 const { data: 结果, error: 错误 } = await 数据库.functions.invoke('login', {
				 body: { 
					 token: 验证令牌,
					 用户名: 用户名,
					 密码: 密码
				 }
			 });

			 if (错误) throw 错误;
			 if (!结果 || !结果.success) throw new Error(结果.message || '登录失败');

			 alert('登录成功！欢迎回来，' + 用户名);
			 window.location.href = "Four_Components/Activity/InAPP_Activity_Page/HomeAPP/HomeActivity.html";

		 } catch (错误) {
			 console.error('登录错误：', 错误);
			 let 详细错误 = 错误.message;
			 if (错误.context && typeof 错误.context.text === 'function') {
				 详细错误 = await 错误.context.text();
			 }
			 
			 if (window.turnstile) turnstile.reset();
			 alert('登录失败详情：\n' + 详细错误);
		 }
	 }
	 
	 document.getElementById('表单').addEventListener('submit', 执行登录);
  </script>
