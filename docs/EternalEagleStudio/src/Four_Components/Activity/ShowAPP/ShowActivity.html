  <div>
  
  Time：<span id="Time"></span>
  
  <br>
  
  <progress id="progress" value="0" max="3"></progress>
  剩余时间：<span id="剩余时间"></span>
  
  
  <script type="application/javascript">
	'use strict';
	
	alert(window.location.href);
	
	setInterval(function(){
		document.getElementById("Time").innerHTML = new Date().toLocaleString();
	},1000)
   
   let progress = document.getElementById("progress").value;
   let 剩余时间 = 3;
   
   let 计时器 = setInterval(function(){
 	 document.getElementById('剩余时间').innerHTML = 剩余时间+'秒';
	  console.log(progress);
	  console.log(剩余时间);
	  
	  if (progress <= 2) {
			progress ++;
		}
	  if (剩余时间 >=0) {
		  剩余时间 --;
	  }
	  
	  if (剩余时间 <0 && !window.location.href.includes("LoginActivity.html"))
	  {
		alert("页面未跳转，请刷新");
		clearInterval(计时器);
		
		
		let 次数 = 0;
		
		let 提醒器 = setInterval(() => {
			if (window.location.href.includes("LoginActivity.html")) {
				clearInterval(提醒器);
			}
			else {
				alert("页面未跳转，请刷新");
				次数 ++;
				if (次数 === 2) {
					alert("提示次数过多!\n强制执行跳转命令!");
					window.location.replace("Four_Components/Activity/LoginAPP/LoginActivity.html");
				}
			}
		}, 5000);
	  }
	  
	  document.getElementById("progress").setAttribute("value", progress);
	  
   }, 1000);
   
  </script></div>
